<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>XKIN — аксессуары (Telegram)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Montserrat', sans-serif; }

  .banner {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
    position: relative;
    overflow: hidden;
    color: #fff;
  }

  .wave { position: absolute; border-radius: 50%; border: 1px solid rgba(255, 107, 0, 0.15); }
  .w1 { width: 500px; height: 500px; top: -150px; left: -150px; }
  .w2 { width: 700px; height: 700px; top: -250px; left: -200px; border-color: rgba(255, 107, 0, 0.08); }
  .w3 { width: 500px; height: 500px; bottom: -150px; right: -150px; border-color: rgba(255, 69, 0, 0.15); }
  .w4 { width: 400px; height: 400px; bottom: -100px; left: -100px; border-color: rgba(255, 69, 0, 0.08); }

  .glow {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(255, 107, 0, 0.15) 0%, transparent 60%);
    border-radius: 50%; filter: blur(40px);
  }

  .content {
    position: relative; z-index: 10;
    height: 100%;
    padding: 30px 50px 24px 50px;
    display: flex; flex-direction: column;
  }

  .head { display: flex; flex-direction: column; align-items: center; text-align: center; }

  .logo {
    font-size: 32px; font-weight: 900; letter-spacing: 5px;
    background: linear-gradient(90deg, #FF6B00, #FF4500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo span { color: #fff; -webkit-text-fill-color: #fff; font-weight: 400; opacity: 0.7; font-size: 15px; letter-spacing: 2px; margin-left: 8px;}

  .top-tag {
    margin-top: 6px;
    font-size: 14px; font-weight: 700;
    color: #FF6B00;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  h1 {
    margin-top: 4px;
    font-size: 44px; font-weight: 900; line-height: 0.95;
    letter-spacing: -1px;
  }
  h1 .accent {
    background: linear-gradient(90deg, #FF6B00, #FFB300);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .sub {
    margin-top: 6px;
    font-size: 16px; font-weight: 500;
    color: rgba(255,255,255,0.85);
    line-height: 1.3;
  }

  .price-tag {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(90deg, rgba(255, 107, 0, 0.18), rgba(255, 69, 0, 0.18));
    border: 2px solid rgba(255, 107, 0, 0.55);
    border-radius: 14px;
    padding: 8px 20px;
    backdrop-filter: blur(8px);
  }
  .price-tag .ico { font-size: 22px; }
  .price-tag .txt { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.3px; }
  .price-tag .accent { color: #FFB300; }

  /* Сетка товаров 3x2 — фиксированная высота */
  .grid {
    margin-top: 16px;
    height: 580px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
  }

  .cell {
    position: relative;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .cell img { width: 100%; height: 100%; object-fit: cover; }

  /* Подпись ВНУТРИ ячейки (внизу с градиентом) */
  .cell-label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 10px 8px;
    background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    z-index: 5;
  }

  /* Подвал */
  .foot {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }

  .phone-card {
    background: linear-gradient(135deg, #FF6B00, #FF4500);
    border-radius: 14px;
    padding: 10px 22px;
    box-shadow: 0 10px 40px rgba(255, 107, 0, 0.4);
    flex: 1;
  }
  .phone-card .lbl {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.95;
  }
  .phone-card .num {
    font-size: 30px; font-weight: 900;
    letter-spacing: -0.5px; line-height: 1.0; margin-top: 2px;
  }

  .messengers {
    display: flex; gap: 8px; align-items: center;
  }
  .msgr {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="wave w1"></div>
  <div class="wave w2"></div>
  <div class="wave w3"></div>
  <div class="wave w4"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="head">
      <div class="logo">XKIN<span>АКСЕССУАРЫ</span></div>
      <div class="top-tag">🎧 ВСЯ ЛИНЕЙКА В НАЛИЧИИ</div>
      <h1>Всё для <span class="accent">твоего</span><br>телефона</h1>
      <div class="sub">Наушники · Повербанк · Зарядки · Кабели</div>
      <div class="price-tag">
        <div class="ico">💰</div>
        <div class="txt"><span class="accent">Выгодные цены</span> · Опт и розница</div>
      </div>
    </div>

    <div class="grid">
      <div class="cell">
        <img src="products/headphones_bronze.jpg" alt="Наушники XKIN">
        <div class="cell-label">Наушники XKIN</div>
      </div>
      <div class="cell">
        <img src="products/powerbank.jpg" alt="Повербанк XKIN">
        <div class="cell-label">Повербанк 35W</div>
      </div>
      <div class="cell">
        <img src="products/tws_white_box.jpg" alt="TWS XKIN74">
        <div class="cell-label">TWS XKIN74</div>
      </div>
      <div class="cell">
        <img src="products/tws_black.jpg" alt="TWS XKIN73">
        <div class="cell-label">TWS XKIN73</div>
      </div>
      <div class="cell">
        <img src="products/cables.jpg" alt="Кабели XKIN">
        <div class="cell-label">Кабели XKIN</div>
      </div>
      <div class="cell">
        <img src="products/headphones_black.jpg" alt="Наушники XKIN">
        <div class="cell-label">Наушники XKIN</div>
      </div>
    </div>

    <div class="foot">
      <div class="phone-card">
        <div class="lbl">📞 Звони / пиши</div>
        <div class="num">+7 928 035-50-00</div>
      </div>
      <div class="messengers">
        <div class="msgr" title="Telegram">✈️</div>
        <div class="msgr" title="WhatsApp">💬</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
